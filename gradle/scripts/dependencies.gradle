apply from: 'gradle/scripts/helpers.gradle'

repositories {
    // Other repositories described by default:
    // CleanroomMC: https://maven.cleanroommc.com
    exclusiveContent {
        forRepository {
            maven {
                name 'CurseMaven'
                url 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'Modrinth'
                url 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    mavenLocal() // Must be last for caching to work
}

dependencies {
    // Include StripLatestForgeRequirements by default for the dev env, saves everyone a hassle
    runtimeOnly 'com.cleanroommc:strip-latest-forge-requirements:1.0'
    // Include OSXNarratorBlocker by default for the dev env, for M1+ Macs
    runtimeOnly 'com.cleanroommc:osxnarratorblocker:1.0'

    //Nice to play with, and useful for debugging
    //runtimeOnly 'curse.maven:nbt-tooltip-274816:2567902'
    runtimeOnly 'curse.maven:ftb-utilities-forge-237102:3157548'
    runtimeOnly 'curse.maven:ftb-library-legacy-forge-237167:2985811'

    implementation('com.cleanroommc:configanytime:3.0')
    implementation('curse.maven:thaumcraft-223628:2629023')
    implementation('curse.maven:bubbles-a-baubles-fork-995393:6807550')
    implementation('curse.maven:thaumicapi-1533287:8304846')
    implementation('mezz:jei:4.29.7')
    implementation('com.cleanroommc:configanytime:3.0')
    compileOnly('curse.maven:hwyla-253449:2568751')
    compileOnly('curse.maven:the-one-probe-245211:2667280')

    implementation('curse.maven:codechicken-lib-1-8-242818:2779848')
    implementation('curse.maven:visualores-895539:6495943')
    implementation('curse.maven:just-enough-resources-jer-240630:2728585')

    //runtimeOnly('curse.maven:journeymap-32274:5172461')
    runtimeOnly('curse.maven:hwyla-253449:2568751')
    runtimeOnly('curse.maven:the-one-probe-245211:2667280')
